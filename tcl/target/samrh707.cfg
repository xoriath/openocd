#
# Microchip SAMRH707 — rad-hardened Cortex-M7 target
#
# Flash: 128 KiB internal NOR (HEFC controller) at 0x10000000
#
# Debug transport: SWD.
#

transport select swd

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME samrh707
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x4000
}

# -expected-id intentionally omitted: only an internal CHIPID register
# (0x40100000) is available for device identification at runtime, not a
# static SWD-DP IDCODE (DPIDR) value.
swd newdap $_CHIPNAME cpu

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE \
    -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME hefc 0x10000000 0x20000 0 0 $_TARGETNAME

cortex_m reset_config sysresetreq
