#
# Microchip PIC32CM-PL10 target
#
# Notes:
#   - SWD transport only (no JTAG).
#   - PIC32CM-PL10 DSU_DID uses PNDID/PNMID/VER fields, not the classic
#     PROCESSOR/FAMILY/SERIES/DEVSEL scheme.  There is NO DID auto-probe for
#     this family.  The user MUST set PIC32CMPL_VARIANT to the exact part name
#     before sourcing this file, or override it after sourcing (before the first
#     flash bank command is evaluated at run time).
#   - Chip-erase is NOT supported from OpenOCD.  The PIC32CM-PL10 BootROM uses
#     a multi-stage HMAC-challenge sequence for chip erase that is not yet
#     implemented.  Use Microchip MPLAB IPE or a Microchip programmer for erase.
#

transport select swd

# Part variant name -- MUST match one of the entries in pic32cmpl_parts[],
# e.g. PIC32CM6408PL10028 .. PIC32CM1216PL10064.
if { [info exists PIC32CMPL_VARIANT] } {
    set _VARIANT $PIC32CMPL_VARIANT
} else {
    set _VARIANT PIC32CM6408PL10032
    echo "WARNING: PIC32CMPL_VARIANT not set; defaulting to $_VARIANT."
    echo "         Set PIC32CMPL_VARIANT to the exact part name for your board."
}

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32cmpl
}

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x800
}

# -expected-id omitted: not confirmed against hardware.  Do not reuse
# SAML10/L11's ID (0x0bf11477) -- this is a different silicon family
# (Cortex-M0+, not M23).
swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME $_VARIANT

$_TARGETNAME configure -event examine-end {
    dsu_reset_deassert
}

$_TARGETNAME configure -event reset-deassert-post {
    dsu_reset_deassert
}

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
