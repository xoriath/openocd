#
# Microchip PIC32CM-SG00 target
# Cortex-M23 core with FCW flash controller (Group B register layout)
# Flash: 512 kB PFM at 0x0C000000
#
# Note: These devices support SWD only.
# TODO: Add -expected-id for the SWD-DP IDCODE after hardware validation.
#

transport select swd

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32cmsg00
}

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x2000
}

swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
# PIC32CM-SG00: 512 kB PFM.  Override with FLASH_SIZE for other density variants.
if { [info exists FLASH_SIZE] } {
    flash bank $_FLASHNAME pic32cfcw 0x0C000000 $FLASH_SIZE 0 0 $_TARGETNAME CMSG00
} else {
    flash bank $_FLASHNAME pic32cfcw 0x0C000000 0x80000 0 0 $_TARGETNAME CMSG00
}

$_TARGETNAME configure -event examine-end {
    pic32cfcw_reset_deassert
}

$_TARGETNAME configure -event reset-deassert-post {
    pic32cfcw_reset_deassert
}

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
