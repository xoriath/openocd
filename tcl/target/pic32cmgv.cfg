#
# Microchip PIC32CM-GV target
#
# Notes:
#   - SWD transport only (no JTAG).
#   - PIC32CM-GV uses the legacy plain NVMCTRL reset path with no BCC-mailbox
#     handshake (has_bootrom_dal=false).  No DSU boot-ROM extension is needed.
#   - There is NO DID auto-probe for this family.  The user MUST set
#     PIC32CMGV_VARIANT to the exact part name before sourcing this file, or
#     override it after sourcing (before the first flash bank command is
#     evaluated at run time).
#

transport select swd

# Part variant name -- MUST match one of the entries in pic32cmgv_parts[],
# e.g. PIC32CM1602GV00032 .. PIC32CM3204GV00064.
if { [info exists PIC32CMGV_VARIANT] } {
    set _VARIANT $PIC32CMGV_VARIANT
} else {
    set _VARIANT PIC32CM1602GV00032
    echo "WARNING: PIC32CMGV_VARIANT not set; defaulting to $_VARIANT."
    echo "         Set PIC32CMGV_VARIANT to the exact part name for your board."
}

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32cmgv
}

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x800
}

# -expected-id omitted: not confirmed against hardware.
swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME $_VARIANT

$_TARGETNAME configure -event examine-end {
    dsu_reset_deassert
}

$_TARGETNAME configure -event reset-deassert-post {
    dsu_reset_deassert
}

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
