#
# Microchip PIC32CX-MT target
# Cortex-M4/M0+ with dual-plane EEFC (SEFC0/SEFC1).
# Flash: two 512 KB banks.
#   Bank 0 (SEFC0): 0x00400000, controller 0x460E0000
#   Bank 1 (SEFC1): 0x00480000, controller 0x460E2000
#
# Note: These devices support SWD only.
# TODO: Add -expected-id for the SWD-DP IDCODE after hardware validation.
#
# CHIPID_CIDR-based auto-probe is not wired up for this part.  The
# chip-name argument "PIC32CX-MT" is REQUIRED for both flash bank
# declarations, but the driver still reads live flash size/page/sector
# geometry per bank from the EEFC GETD command on first probe, so the
# sizes given here are only a starting default.
#

transport select swd

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32cxmt
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000
}

swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# PIC32CX-MT: dual-plane EEFC — two flash bank declarations required.
# The 7th argument "PIC32CX-MT" selects the named geometry entry in the
# at91sam4 driver, bypassing the CHIPID_CIDR auto-detect (not yet wired up).
flash bank ${_CHIPNAME}.flash0 at91sam4 0x00400000 0x80000 0 0 $_TARGETNAME PIC32CX-MT
flash bank ${_CHIPNAME}.flash1 at91sam4 0x00480000 0x80000 0 0 $_TARGETNAME PIC32CX-MT

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
