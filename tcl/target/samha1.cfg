# Microchip ATSAMHA1 target configuration (Cortex-M0+, NVMCTRL flash)
#
# SAMHA1 is a Cortex-M0+ part in the SAM HA family with NVMCTRL flash.
# There is no DID auto-probe for this family; the exact part name must be
# passed as SAMHA1_VARIANT.  Legacy Cortex-M0+ reset path, no BCC/DAL
# handshake needed.
#
# Usage:
#   set SAMHA1_VARIANT ATSAMHA1G16A
#   source [find target/samha1.cfg]

if { [info exists SAMHA1_VARIANT] } {
	set _VARIANT $SAMHA1_VARIANT
} else {
	set _VARIANT ATSAMHA1G16A
	echo "SAMHA1: SAMHA1_VARIANT not set, defaulting to ATSAMHA1G16A"
	echo "        Set SAMHA1_VARIANT to the exact part name before sourcing this file."
}

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME samha1
}

if { [info exists ENDIAN] } {
	set _ENDIAN $ENDIAN
} else {
	set _ENDIAN little
}

if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x2000
}

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x0bc11477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
set _FLASHNAME $_CHIPNAME.flash

target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME $_VARIANT

cortex_m reset_config sysresetreq
