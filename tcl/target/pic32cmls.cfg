#
# Microchip PIC32CM-LS target
#
# Notes:
#   - SWD transport only (no JTAG).
#   - PIC32CM-LS is a Cortex-M23 device.  Its DSU layout is IDENTICAL to
#     SAML10/L11 (verified against sequences.xml), so the saml1x_dsu_layout
#     is reused directly.  The DSU BCC-mailbox DAL reset-extension handshake
#     IS required (has_bootrom_dal=true).
#   - PIC32CM-LS has a real DSU_DID and is auto-probed normally.  Setting
#     PIC32CMLS_VARIANT is optional; it forces a specific part name and
#     skips the DID probe.  1216-size SKUs share an identical DID with the
#     equivalent PIC32CM-LE parts, and 5164LS60 shares DEVSEL bytes with
#     5164LS00 under a different SERIES; auto-probe may report the wrong
#     part name in those cases (geometry is unaffected either way).
#   - "at91samd chip-erase" performs a full chip erase via the "ALL" BootROM
#     command, using the factory-default CEKEY (all 0xFFFFFFFF) unless a
#     custom key is supplied via PIC32CMLS_CEKEY (see below).  If the key
#     is wrong for this device, chip-erase fails with a clear error.
#
#   - PIC32CMLS_CEKEY: optional 4-word custom CEKEY, for devices whose BOCOR
#     was provisioned with a non-default erase key.  Must be set together
#     with PIC32CMLS_VARIANT (the key is passed as extra arguments after the
#     variant name on the "flash bank" command).  Example:
#       set PIC32CMLS_VARIANT PIC32CM5164LS00048
#       set PIC32CMLS_CEKEY {0x11223344 0x55667788 0x99aabbcc 0xddeeff00}
#       source [find target/pic32cmls.cfg]
#   - TODO: PIC32CM-LS has DUAL NVMCTRL controller instances; the active
#     instance is selected by the DAL value read from DSU_STATUSB bits[1:0].
#     This DAL-aware NVMCTRL offset selection is NOT implemented in the driver.
#     Flash operations may only work correctly at DAL=full-access until this
#     is addressed.
#

transport select swd

# Optional part variant name override -- see pic32cmls_parts[] in
# src/flash/nor/at91samd.c for valid names.
if { [info exists PIC32CMLS_VARIANT] } {
    set _VARIANT $PIC32CMLS_VARIANT
} else {
    set _VARIANT ""
}

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32cmls
}

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x800
}

# -expected-id omitted: not confirmed against hardware.  Do not reuse
# SAML10/L11's ID (0x0bf11477); while the DSU block layout is the same,
# the silicon family is different.
swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
if { $_VARIANT ne "" && [info exists PIC32CMLS_CEKEY] } {
    flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME $_VARIANT {*}$PIC32CMLS_CEKEY
} elseif { $_VARIANT ne "" } {
    flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME $_VARIANT
} else {
    flash bank $_FLASHNAME at91samd 0 0 0 0 $_TARGETNAME
}

$_TARGETNAME configure -event examine-end {
    dsu_reset_deassert
}

$_TARGETNAME configure -event reset-deassert-post {
    dsu_reset_deassert
}

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
