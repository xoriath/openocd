#
# Microchip PIC32CZ-CA70 target
# Cortex-M7 core with EEFC flash controller (same command protocol as SAM4).
# Flash: 2 MB IFLASH at 0x00400000 (confirmed geometry).
#
# Note: These devices support SWD only.
# TODO: Add -expected-id for the SWD-DP IDCODE after hardware validation.
#
# CHIPID_CIDR-based auto-probe is not wired up for this part (its CHIPID
# register lives at 0x400e0940, not the classic SAM4 address).  The
# chip-name argument "PIC32CZ-CA70" is REQUIRED, but the driver still
# reads live flash size/page/sector geometry from the EEFC GETD command
# on first probe, so the size given here is only a starting default.
#

transport select swd

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32czca70
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000
}

swd newdap $_CHIPNAME cpu
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
# The 7th argument "PIC32CZ-CA70" selects the named geometry entry in the
# at91sam4 driver, bypassing the CHIPID_CIDR auto-detect (not yet wired up).
flash bank $_FLASHNAME at91sam4 0x00400000 0x200000 0 0 $_TARGETNAME PIC32CZ-CA70

if {![using_hla]} {
    cortex_m reset_config sysresetreq
}
